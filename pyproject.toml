[project]
name = "lgt"
version = "0.1.0"
description = "Computational lattice gauge theory course: core library"
authors = [
    { name = "Eyal Merhavi" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "jupytext>=1.19.6",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
]
